# Workspace root for Vibe Work. Logic lives in crates/, the Tauri crate in app/ is thin wiring only.
# Dependency direction: app -> host -> debug-api -> core-api -> gate -> session
# -> rpc -> protocol; supervisor used by core-api/gate, platform and mistral by app/gate/debug-api.
# No cycles.
[workspace]
resolver = "2"
members = [
    "crates/vw-protocol",
    "crates/vw-rpc",
    "crates/vw-session",
    "crates/vw-supervisor",
    "crates/vw-gate",
    "crates/vw-ask",
    "crates/vw-vocabulary",
    "crates/vw-core-api",
    "crates/vw-debug-api",
    "crates/vw-host",
    "crates/vw-platform",
    "crates/vw-secrets",
    "crates/vw-logscan",
    "crates/vw-mistral",
    "crates/vw-vault",
    "crates/vw-keyproxy",
    "crates/vw-keys",
    "crates/vw-procmon",
    "crates/vw-terminal",
    "crates/vw-documents",
    "crates/vw-agent-tools",
    "crates/vw-changes",
    "crates/vw-proposals",
    "crates/vw-worktrees",
    "crates/vw-git",
    "crates/vw-gh-broker",
    "crates/vw-preview",
    "crates/vw-video",
    "crates/vw-video-types",
    "crates/vw-netguard",
    "crates/vw-browser",
    "crates/vw-pages",
    "crates/vw-projects",
    "crates/vw-vibe-install",
    "crates/vw-market",
    "crates/vw-skills",
    "tools/public/vibe-support/sign",
    "tools/public/update-manifest",
    "tests/public/rust",
    "app",
]
# The copied ShellX Vault crates have their own workspace manifest (third_party/shellx-vault/Cargo.toml)
# and are compiled as path dependencies only. The patched tauri-runtime-wry copy (below) is third-party
# code too: excluded from the workspace so our lints never apply to it.
exclude = ["third_party/shellx-vault", "third_party/tauri-runtime-wry", "third_party/wry"]

# tauri-runtime-wry 2.12.1 with native child-view patches: on Windows it applies
# `data_store_identifier` as a WebView2 profile name (tauri-apps/tauri PR #16054), so each session's preview
# keeps its own cookies even when WEBVIEW2_USER_DATA_FOLDER or the UserDataFolder policy overrides the
# per-session data folder. Same version as the registry crate, so tauri 2.12.1 resolves to it. Byte-identical
# to the published crate except src/lib.rs (third_party/tauri-runtime-wry/PROVENANCE.json). Exit: remove when
# a release contains the changes; vw-webview's mount check refuses a Windows preview without its own profile.
# Linux children start hidden until vw-webview places or parks them, so GtkBox never divides the main UI's
# allocation with a newly created blank child. The main window's content still starts visible.
[patch.crates-io]
tauri-runtime-wry = { path = "third_party/tauri-runtime-wry" }
# NAV: retain WK frame context through Tauri's URL-only callback (see the copy's PROVENANCE.json).
wry = { path = "third_party/wry" }

# Shared sources and exact version requirements. Members keep their own features and optionality.
