# Vibe Work continuous integration.
#
# Runs the repository's one check command, `scripts/public/check.sh`, on Linux, Windows and macOS for every push
# and pull request: rustfmt, the production UI bundle (type check + Vite build), Clippy with warnings as errors,
# the Rust tests of the whole workspace, the UI type check, lint, format check and tests, the file size and colour
# checks, the public-paths scan, the generated protocol code check against the pinned Vibe, and the core API
# TypeScript drift check.
#
# Build and test evidence only. It needs no secrets, holds read-only repository permission, signs nothing and
# publishes nothing: release installers are built, signed and checked on maintainer machines and attached to a
# GitHub release by hand. Third-party actions are pinned to full commit SHAs (the tag is in the comment).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "4"
  # This repository is the public one: the public-paths scan then requires every tracked file to be allowlisted.
  VW_PUBLIC_REPO: "1"
  # The check's own memory cap needs a systemd user session, which hosted runners lack; it falls back to
  # running the commands directly, which is fine on a dedicated runner.

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 150
    steps:
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        # A debug build of the workspace with its tests needs more room than the hosted image leaves free.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux build packages
        if: runner.os == 'Linux'
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Dpkg::Use-Pty=0 -o Acquire::Retries=3 install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev \
            libwebkit2gtk-4.1-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Rust toolchain (rust-toolchain.toml)
        run: |
          rustup toolchain install
          rustup show active-toolchain
          rustc --version
          cargo --version

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only the main branch writes the cache, so pull requests cannot replace it.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.33.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14.8"

      - name: Install the pinned Vibe for real-server tests and generated-code checks
        # The same hash-locked requirements the app installs at setup (crates/vw-vibe-install/pin); wheels only.
        run: |
          python -m venv "$RUNNER_TEMP/vibe"
          if [ "$RUNNER_OS" = Windows ]; then py="$RUNNER_TEMP/vibe/Scripts/python.exe"; else py="$RUNNER_TEMP/vibe/bin/python"; fi
          "$py" -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary :all: \
            -r crates/vw-vibe-install/pin/vibe.requirements.txt
          "$py" -c "import importlib.metadata as m; print('mistral-vibe', m.version('mistral-vibe'))"
          echo "VIBE_PYTHON=$py" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then server="$RUNNER_TEMP/vibe/Scripts/vibe-app-server.exe"; else server="$RUNNER_TEMP/vibe/bin/vibe-app-server"; fi
          echo "VW_TEST_VIBE_SERVER=$server" >> "$GITHUB_ENV"

      - name: scripts/public/check.sh
        run: bash scripts/public/check.sh

      - name: Disk left (diagnostics)
        if: always()
        run: df -h . || true
