[package]
name = "vibe-support-sign"
description = "Release tool: signs the supported-Vibe manifest (and any channel file) with the minisign updater key, in the encoding the Tauri CLI writes; the key and its password come from pipes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The reference minisign implementation (same author and format as minisign-verify, which the app checks with;
# the Tauri CLI signs update packages with this crate too). MIT. Signing needs it; the app never links it.
minisign = "0.9.1"
base64 = "0.22"
