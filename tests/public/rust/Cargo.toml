# Public integration tests over pinned Vibe, scripted loopback services and disposable files.
# The root check runs these on every platform; install the hash-locked Vibe as in README Develop.
[package]
name = "vw-public-tests"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
# Strict OCR fixtures decode files before claiming the provider accepts them.
oxideav-avif = "0.0.11"
oxideav-core = "0.1"
lopdf = { workspace = true }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "webp", "gif", "tiff", "bmp"] }
serde = { workspace = true }
serde_json = { workspace = true }
regex = { workspace = true }
tokio = { workspace = true, features = ["full", "test-util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, default-features = true, features = ["fmt"] }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
reqwest = { workspace = true, features = ["stream"] }
futures-util = { workspace = true, default-features = true }
sha2 = "0.10"
base64 = "0.23"
minisign = { workspace = true }
toml = "0.8"
url = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
tar = { workspace = true }
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }
vw-rpc = { workspace = true }
vw-supervisor = { workspace = true }
vw-platform = { workspace = true }
vw-secrets = { workspace = true }
vw-gate = { workspace = true }
vw-core-api = { workspace = true }
vw-debug-api = { workspace = true }
vw-host = { workspace = true }
vw-vault = { workspace = true }
vw-keyproxy = { workspace = true }
vw-keys = { workspace = true }
vw-procmon = { workspace = true }
vw-documents = { workspace = true }
vw-agent-tools = { workspace = true }
vw-changes = { workspace = true }
vw-worktrees = { workspace = true }
vw-pages = { workspace = true }
vw-vibe-install = { workspace = true }
vw-netguard = { workspace = true }
make-latest-json = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }
