# Cargo settings shared by the root workspace and the maintainers' private test workspace, which
# both build into the same target dir. Profile settings live here, not in either Cargo.toml, so the two
# workspaces stay identical and never rebuild each other's dependencies.
#
# Debug info: full DWARF for every dependency made each debug target dir 15-30 GB (every test binary links
# all of them). Dependencies get none; our own crates keep line tables, so panics and backtraces still
# name file:line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The minimum macOS: every macOS build (app, sidecar, tests) targets 14.0, the release's LSMinimumSystemVersion (the
# macOS bundle script checks both). 14 is what the macOS preview network guard needs (the app crate's default feature
# `macos-proxy`: Network.framework's proxy API for each preview's website data store, macOS 14+). The app crate also
# gets this value from app/tauri.conf.json (`bundle.macOS.minimumSystemVersion`, set by tauri-build); keep the two
# equal. Ignored on Linux and Windows; a value already in the environment wins (no `force`).
[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"
