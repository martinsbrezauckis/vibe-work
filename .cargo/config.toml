# Cargo settings shared by the root workspace and the maintainers' private test workspace, which
# both build into the same target dir. Profile settings live here, not in either Cargo.toml, so the two
# workspaces stay identical and never rebuild each other's dependencies.
#
# Debug info: full DWARF for every dependency made each debug target dir 15-30 GB (every test binary links
# all of them). Dependencies get none; our own crates keep line tables, so panics and backtraces still
# name file:line.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The minimum macOS: every macOS build (app, sidecar, tests) targets 11.0, the release's LSMinimumSystemVersion (the
# macOS bundle script checks both; Vibe's `macosx_11_0` wheels need 11). The macOS preview network guard (vw-webview
# feature `macos-proxy`, Network.framework's proxy API) needs 14: it comes in 0.1.3 together with this value and the
# bundle's minimum at 14.0. Ignored on Linux and Windows; a value already in the environment wins (no `force`).
[env]
MACOSX_DEPLOYMENT_TARGET = "11.0"
