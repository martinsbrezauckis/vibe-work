[package]
name = "app"
description = "Vibe Work Tauri application: thin wiring between the window and the vw-* crates"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[features]
# Optional agent capture directly into the vault. Off in default builds.
agent-vault = ["vw-core-api/agent-vault"]
# Upstream HTTP, HTTPS and SOCKS transports, included in release builds.
proxy-transports = ["vw-core-api/proxy-transports"]
# Bounded video review using installed system decoders and the packaged isolated helper.
video = ["vw-core-api/video"]
linux-video = ["video", "vw-core-api/linux-video"]
# Firefox and Edge ship in the default build.
your-firefox = ["vw-core-api/your-firefox"]
your-edge = ["vw-core-api/your-edge"]
# The macOS release builder enables Safari; other platforms leave it out.
your-safari = ["vw-core-api/your-safari"]
# Embed ui/dist instead of loading the dev server (what `tauri build` turns on). The private
# end-to-end runs build with it so a debug binary (Debug API and dev launch on) shows the real UI.
custom-protocol = ["tauri/custom-protocol"]
# The e2e runs' in-page channel through the Debug API (vw-debug-api `e2e_script`), for driving the real
# window where no WebDriver exists (macOS). Debug test builds only: refused in release builds (src/lib.rs and vw-debug-api).
e2e-script = ["vw-debug-api/e2e-script", "vw-core-api/e2e-script"]
# The vault test switch (private e2e debug builds only; refused in release builds by vw-core-api and
# vw-debug-api). Also enables the app startup's local marketplace fixture input.
vault-e2e = ["vw-debug-api/vault-e2e"]
# On by default: on macOS every preview and prototype page reaches the network only through the network guard
# (vw-webview `macos-proxy`, Network.framework's proxy API: macOS 14+, the release minimum in tauri.conf.json and
# .cargo/config.toml). No effect on Linux and Windows. `--no-default-features` builds the macOS content-rules-only
# previews (minimum 11), which no release ships.
default = ["macos-proxy", "your-edge", "your-firefox", "proxy-transports", "video", "linux-video"]
macos-proxy = ["vw-webview/macos-proxy"]

[dependencies]
# Tauri's standard data folder, resolved before a second launch initializes the GUI runtime.
dirs = "7"
tauri = { workspace = true, features = ["tray-icon"] }
# Native dialogs (folder picker, delete confirmation), used from Rust only: the webview gets no plugin
# permission (capabilities/main.json lists bridge commands only). Pinned exactly. Notifications use vw-platform (notify-rust), see its notify.rs for why.
tauri-plugin-dialog = "=2.8.1"
# `tauri::generate_context!` emits `serde_json` values for a build whose config has plugin settings (the
# updater channel of a release or test overlay), so the crate must name it.
serde_json = { workspace = true }
vw-vocabulary = { workspace = true }
vw-host = { workspace = true }
# The Vibe installer type held for the Vibe update check (`updater::VibeSlot`).
vw-vibe-install = { workspace = true }
vw-core-api = { workspace = true }
vw-supervisor = { workspace = true }
vw-platform = { workspace = true, features = ["desktop-tray", "startup-dialog"] }
vw-gate = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
vw-mistral = { workspace = true }
vw-keys = { workspace = true }
vw-keyproxy = { workspace = true }
vw-vault = { workspace = true }
# Preview pane: the model the core drives and its Tauri engine (child webviews).
vw-preview = { workspace = true }
vw-webview = { path = "../crates/vw-webview" }
# The agent browser's network guard.
vw-netguard = { workspace = true }
# The Debug API's window routes: the `AppWindow` this crate implements on Tauri.
vw-debug-api = { workspace = true }
# Project Pages: the page viewer settings.
vw-pages = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "env-filter", "std"] }

# Updates: registered only for builds whose config carries an accepted update channel
# (vw_host::updates). Pinned exactly. TLS follows
# vw-mistral: rustls (ring) on Linux, the OS's native TLS on Windows and macOS (the plugin's default rustls
# would also build ring for Windows, which the cross-target lint on WSL cannot compile).
[dev-dependencies]
tempfile = { workspace = true }
# Tauri's mock runtime for the Linux confirmation window tests (`dialogs/linux_confirmation.rs`).
tauri = { workspace = true, features = ["test"] }
# The release manifest tool: its output must parse with the updater plugin (`updater::manifest_format`).
make-latest-json = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
tauri-plugin-updater = { workspace = true, features = ["rustls-tls", "system-proxy"] }
# Confirmation windows need a handle so cancellation can close the GTK dialog.
gtk = { workspace = true }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tauri-plugin-updater = { workspace = true, features = ["native-tls", "system-proxy", "zip"] }
