[package]
name = "vw-keys"
description = "The key service: Vault storage of the Mistral key, the model proxy, Vibe's launch overrides, key import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-vault = { path = "../vw-vault" }
# Vibe's own key, once found, is registered for the Debug API's redaction.
vw-secrets = { path = "../vw-secrets" }
vw-keyproxy = { path = "../vw-keyproxy" }
vw-mistral = { path = "../vw-mistral" }
keyring-core = "=1.0.0"
reqwest = { version = "0.13.5", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1.53", features = ["rt", "sync"] }
tracing = "0.1"
zeroize = "1.8"
# Encodes the vault's random network MAC key; both crates already occur in the workspace lock.
base64 = "0.23"
getrandom = "0.3"

# Lowercase owner-scalar encoding; already present in the workspace lock.
hex = "0.4"
