[package]
name = "vw-keys"
description = "The key service: Vault storage of the Mistral key, the model proxy, Vibe's launch overrides, key import"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-vault = { workspace = true }
# Vibe's own key, once found, is registered for the Debug API's redaction.
vw-secrets = { workspace = true }
vw-keyproxy = { workspace = true }
vw-mistral = { workspace = true, features = ["proxy-transports"] }
vw-netguard = { workspace = true, features = ["proxy-transports"] }
vw-platform = { workspace = true }
url = { workspace = true }
keyring-core = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt", "sync"] }
tracing = { workspace = true }
zeroize = { workspace = true }
# Encodes the vault's random network MAC key; both crates already occur in the workspace lock.
base64 = "0.23"
getrandom = { workspace = true }

# Lowercase owner-scalar encoding; already present in the workspace lock.
hex = { workspace = true }

[features]
# Optional agent capture directly into the vault. Off in default builds.
agent-vault = ["vw-vault/agent-vault"]
