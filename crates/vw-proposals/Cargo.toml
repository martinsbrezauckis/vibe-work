# Protected-file proposals; standard filesystem checks and diffs for future review clients.
[package]
name = "vw-proposals"
description = "Standalone capture, review and approved application of protected-folder changes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
getrandom = "0.3"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10.9"
similar = "3.2.0"
tempfile = "3"
thiserror = "2"

[dev-dependencies]
serde_json = "1"
