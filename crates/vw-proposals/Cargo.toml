# Protected-file proposals; standard filesystem checks and diffs for future review clients.
[package]
name = "vw-proposals"
description = "Standalone capture, review and approved application of protected-folder changes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
getrandom = { workspace = true }
serde = { workspace = true, features = ["derive"] }
sha2 = { workspace = true }
similar = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
