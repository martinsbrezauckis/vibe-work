[package]
name = "vw-gate"
description = "Method gate: allowlist and typed privileged handlers"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Keep the method gate's transport contract aligned with the app's network settings.
proxy-transports = ["vw-mistral/proxy-transports"]

[dependencies]
vw-ask = { workspace = true }
vw-vocabulary = { workspace = true }
vw-session = { workspace = true }
vw-rpc = { workspace = true }
vw-protocol = { workspace = true }
vw-supervisor = { workspace = true }
vw-platform = { workspace = true }
vw-mistral = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# float_roundtrip: parse f64 exactly so forwarded params stay byte-faithful; features unify across
# the workspace (same note as vw-session).
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
# WHATWG URL parsing for the MCP server address rule (`mcp_url.rs`; already in Cargo.lock via vw-platform).
url = { workspace = true }
tracing = { workspace = true }
# CSPRNG for confirmation tokens and client message ids (getrandom 0.3.4 is already in Cargo.lock).
getrandom = { workspace = true }
