[package]
name = "vw-agent-tools"
description = "Session-scoped agent tools: the stdio MCP server and kill-guard hook binary, their wire format, credentials, the kill-command parser and the detached agent-process spawn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
# One shipped tools binary also supplies the credential-free gh shim and the app-owned broker mode.
# Vibe starts its MCP server per session and its guard per tool call; no webview stack is linked.
name = "vw-agent-tools"
path = "src/main.rs"

[dependencies]
vw-gh-broker = { path = "../vw-gh-broker" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Random credentials (same version as vw-keyproxy, already in the lockfile).
getrandom = "0.3"
# Constant-time credential comparison (same as vw-keyproxy).
subtle = "2.6"
# Refusal texts name paths as people write them (no `\\?\` prefix); same version as vw-platform (lockfile).
dunce = "1.0.5"

[target.'cfg(windows)'.dependencies]
# The `bash.exe` mode's kill-on-close job (`vw_platform::kill_job`): the one crate allowed the Win32 calls it needs.
vw-platform = { path = "../vw-platform" }
