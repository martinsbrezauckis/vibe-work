[package]
name = "vw-agent-tools"
description = "Session-scoped agent tools: the stdio MCP server and kill-guard hook binary, their wire format, credentials, the kill-command parser and the detached agent-process spawn"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
# One shipped tools binary also supplies the credential-free gh shim and the app-owned broker mode.
# Vibe starts its MCP server per session and its guard per tool call; no webview stack is linked.
name = "vw-agent-tools"
path = "src/main.rs"

[features]
# Optional agent capture directly into the vault. Off in default builds.
agent-vault = []
video = []
# Linux release video support; release builders enable this alongside the app feature.
linux-video = ["video"]

[dependencies]
vw-video-types = { workspace = true }
vw-gh-broker = { path = "../vw-gh-broker" }
# Access-mode names in tool descriptions come from the shared vocabulary.
vw-vocabulary = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# PowerShell -EncodedCommand text is read by the guards (same version as the workspace).
base64 = { workspace = true }
# Random credentials (same version as vw-keyproxy, already in the lockfile).
getrandom = { workspace = true }
# Constant-time credential comparison (same as vw-keyproxy).
subtle = { workspace = true }
# Refusal texts name paths as people write them (no `\\?\` prefix); same version as vw-platform (lockfile).
dunce = { workspace = true }

[target.'cfg(target_os = "linux")'.dependencies]
# Non-dumpable MCP helper, as vw-platform's harden_process does for the core; already in the lockfile.
rustix = { workspace = true, default-features = true, features = ["process"] }

[target.'cfg(windows)'.dependencies]
# The `bash.exe` mode's kill-on-close job (`vw_platform::kill_job`): the one crate allowed the Win32 calls it needs.
vw-platform = { workspace = true }
