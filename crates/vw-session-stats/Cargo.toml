# Stored session statistics; depends on serde parsers, called by core clients and fixture tests.
[package]
name = "vw-session-stats"
description = "Streaming statistics from stored Vibe sessions, preserving unknown measurements"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
