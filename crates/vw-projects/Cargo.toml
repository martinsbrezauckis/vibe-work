[package]
name = "vw-projects"
description = "The user's project groups: named projects, an optional main folder, the session -> project map, the filing rules and the reconcile with Vibe's session list"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# TypeScript bindings of the public types, enabled by vw-core-api's `ts` feature (gen-core-ts).
ts = ["dep:ts-rs"]

[dependencies]
# User-only folder and the atomic file replace shared with the comment stores.
vw-platform = { path = "../vw-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# Random project ids; getrandom 0.3 is already in the lock file (vw-gate, vw-pages,...).
getrandom = "0.3"
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
