[package]
name = "vw-changes"
description = "The Changes tab's core: per-session git baseline, diff by file and hunk, keep and revert, live refresh, folders without git"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# TypeScript bindings of the public types, enabled by vw-core-api's `ts` feature (gen-core-ts).
ts = ["dep:ts-rs"]

[dependencies]
vw-platform = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
# File watcher for live refresh. 8.2.0 is the newest stable (9.0 is rc.5), CC0-1.0,
# MSRV 1.77; inotify on Linux, ReadDirectoryChangesW on Windows, FSEvents on macOS.
notify = { workspace = true }
# Line diff for hunks (git may not diff the working tree: its diff drivers and filters would run). Checked
# 3.2.0 (Apache-2.0, MSRV 1.85), Myers with a deadline, default features only.
similar = { workspace = true }
# Verifying every object we read from the repository against its id (integrity check: the agent can
# rewrite `.git/objects`). sha1 0.10.7 / sha2 0.10.9 (RustCrypto, MIT OR Apache-2.0); sha2 0.10 is already in
# the lockfile..
sha1 = "0.10.7"
sha2 = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
