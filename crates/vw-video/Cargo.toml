# Bounded video jobs and helper; optional core integration keeps default releases unchanged.
[package]
name = "vw-video"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
[lints]
workspace = true
[features]
helper = ["vw-platform/video"]
[[bin]]
name = "vw-video-helper"
path = "src/main.rs"
required-features = ["helper"]
[dependencies]
vw-video-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
vw-platform = { workspace = true, features = ["video-sandbox"] }
vw-preview = { workspace = true }
vw-agent-tools = { workspace = true }
tokio = { workspace = true, features = ["process", "rt", "macros", "sync", "time", "io-util"] }
process-wrap = { workspace = true, features = ["tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags"] }
tempfile = { workspace = true }
sha2 = "0.10"
base64 = { workspace = true }
[dev-dependencies]
