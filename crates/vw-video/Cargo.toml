# Bounded video jobs and helper; optional core integration keeps default releases unchanged.
[package]
name = "vw-video"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
[lints]
workspace = true
[features]
helper = ["vw-platform/video"]
[[bin]]
name = "vw-video-helper"
path = "src/main.rs"
required-features = ["helper"]
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
vw-platform = { path = "../vw-platform" }
vw-preview = { path = "../vw-preview" }
vw-agent-tools = { path = "../vw-agent-tools" }
tokio = { version = "1.53", features = ["process", "rt", "macros", "sync", "time", "io-util"] }
process-wrap = { version = "10.0.1", default-features = false, features = ["tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags"] }
tempfile = "3"
sha2 = "0.10"
base64 = "0.22"
[dev-dependencies]
