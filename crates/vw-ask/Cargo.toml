# Pure permission policy and copy, shared by the gate and core.
[package]
name = "vw-ask"
description = "Permission ask policy, records and agent sentences"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
[lints]
workspace = true
[features]
ts = ["dep:ts-rs"]
[dependencies]
serde = { version = "1", features = ["derive"] }
vw-vocabulary = { path = "../vw-vocabulary" }
ts-rs = { version = "12.0.1", optional = true, features = ["no-serde-warnings"] }
[dev-dependencies]
serde_json = "1"
