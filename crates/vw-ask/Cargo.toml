# Pure permission policy and copy, shared by the gate and core.
[package]
name = "vw-ask"
description = "Permission ask policy, records and agent sentences"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false
[lints]
workspace = true
[features]
# Optional agent capture directly into the vault. Off in default builds.
agent-vault = []
ts = ["dep:ts-rs"]
[dependencies]
serde = { workspace = true, features = ["derive"] }
vw-vocabulary = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["no-serde-warnings"] }
serde_json = { workspace = true }
