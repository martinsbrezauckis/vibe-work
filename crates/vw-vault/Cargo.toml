[package]
name = "vw-vault"
description = "Vibe Work's own thin client of ShellX Vault: local vault storage, unlock, remembered device"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-vocabulary = { path = "../vw-vocabulary" }
# stored secret values register here so the Debug API never returns them.
vw-secrets = { path = "../vw-secrets" }
# The shared Vault storage core, a byte-identical copy at the pin in
# third_party/shellx-vault/PROVENANCE.json (only the core is shared).
vault-core = { path = "../../third_party/shellx-vault/crates/vault-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1.8"
hex = "0.4"
# a login's site address (origin of a URL).
url = "2"
thiserror = "2"
zeroize = "1.8"
# Remembered device (ShellX's scheme): the OS credential store through keyring-core.
# Versions checked on crates.io (keyring-core 1.0.0; store crates need Rust 1.88).
keyring-core = "=1.0.0"

[target.'cfg(target_os = "linux")'.dependencies]
# Pure-Rust zbus (no libdbus), its own async-io runtime: safe to call from a blocking thread of a
# tokio program (never from inside a tokio task).
zbus-secret-service-keyring-store = { version = "=1.0.1", default-features = false, features = ["rt-async-io-crypto-rust"] }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = "=1.1.0"
# Rust-only BLAKE3 on Windows (same output; no C/asm build): the copied vault-core uses blake3, and
# its C/assembly backends cannot be cross-built for the msvc target from WSL (check-all's Windows lint).
blake3 = { version = "1.8", features = ["pure"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", default-features = false, features = ["keychain"] }
