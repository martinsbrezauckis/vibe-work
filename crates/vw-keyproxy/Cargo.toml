[package]
name = "vw-keyproxy"
description = "Local model proxy: Vibe gets a placeholder key, the core adds the real one"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-vocabulary = { path = "../vw-vocabulary" }
# stored secret values register here so the Debug API never returns them.
vw-secrets = { path = "../vw-secrets" }
vw-mistral = { path = "../vw-mistral" }
# the connector rule (forge writes are the user's Push button), shared with the pre_tool hook.
vw-agent-tools = { path = "../vw-agent-tools" }
vw-supervisor = { path = "../vw-supervisor" }
# Loopback HTTP/1.1 server (same version and features as vw-debug-api).
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.3"
reqwest = { version = "0.13.5", default-features = false, features = ["stream"] }
serde_json = "1"
subtle = "2.6"
thiserror = "2"
tokio = { version = "1.53", features = ["macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
zeroize = "1.8"
