[package]
name = "vw-keyproxy"
description = "Local model proxy: Vibe gets a placeholder key, the core adds the real one"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-vocabulary = { workspace = true }
# stored secret values register here so the Debug API never returns them.
vw-secrets = { workspace = true }
vw-mistral = { workspace = true }
# the connector rule (forge writes are the user's Push button), shared with the pre_tool hook.
vw-agent-tools = { workspace = true }
vw-supervisor = { workspace = true }
# Loopback HTTP/1.1 server (same version and features as vw-debug-api).
axum = { workspace = true, features = ["http1", "tokio"] }
futures-util = { workspace = true, features = ["std"] }
getrandom = { workspace = true }
reqwest = { workspace = true, features = ["stream"] }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tracing = { workspace = true }
zeroize = { workspace = true }
