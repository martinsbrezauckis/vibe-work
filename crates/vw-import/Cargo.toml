# Reads four other coding agents' setups into a plan of what Vibe Work could bring.
[package]
name = "vw-import"
description = "Read-only scan of other coding agents' instructions, skills and MCP servers into an import plan"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# TypeScript bindings of the plan types, enabled by vw-core-api's `ts` feature (gen-core-ts).
ts = ["dep:ts-rs"]

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
toml = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tempfile = { workspace = true }
