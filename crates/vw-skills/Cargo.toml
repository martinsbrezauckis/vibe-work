# Standalone skills protocol and view; serde handles the wire and callers supply transport.
[package]
name = "vw-skills"
description = "Transport-free Vibe skills client and manager view"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt", "process", "io-util", "time", "sync"] }
tempfile = { workspace = true }
