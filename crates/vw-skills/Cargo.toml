# Standalone skills protocol and view; serde handles the wire and callers supply transport.
[package]
name = "vw-skills"
description = "Transport-free Vibe skills client and manager view"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.53", features = ["macros", "rt", "process", "io-util", "time", "sync"] }
tempfile = "3"
