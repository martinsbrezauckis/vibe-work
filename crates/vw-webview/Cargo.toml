[package]
name = "vw-webview"
description = "The preview engine on Tauri: child webviews in the main window with their own storage and no IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Optional host-drawn feedback, absent from release defaults.
# The macOS preview network guard: every preview's website data store sends its traffic through the guard's listener
# (`WKWebsiteDataStore.proxyConfigurations`, wry's `mac-proxy`: Network.framework's HTTP CONNECT proxy, linked
# directly, macOS 14+), and a preview without a working check is refused. On in every
# app build (the app crate's default feature; the release minimum is macOS 14.0). Off (`--no-default-features` on the
# app): macOS previews, including required previews, retain per-mount content rules and refuse failed rule installs.
# No effect on Linux/Windows.
macos-proxy = ["tauri/macos-proxy"]

[dependencies]
vw-preview = { workspace = true }
vw-mistral = { workspace = true }
reqwest = { workspace = true }
# The agent browser's network guard.
vw-netguard = { workspace = true }
vw-platform = { workspace = true, features = ["webview"] }
# `unstable` = `Window::add_child` (multiwebview; on docs.rs for 2.12.2: still behind the
# flag). Same version as the app crate; the features unify into the app's tauri.
tauri = { workspace = true, features = ["unstable"] }
tokio = { workspace = true, features = ["sync", "time", "rt", "fs", "io-util"] }
tracing = { workspace = true }
url = { workspace = true }
serde_json = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Patched with frame context only; features come from Tauri's same Wry instance.
wry = { version = "=0.57.0", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
# The same versions tauri/wry use (lockfile): GTK placement of child webviews and WebKitGTK snapshots.
gtk = { workspace = true }
webkit2gtk = { workspace = true }
javascriptcore-rs = "=1.1.2"
cairo-rs = { version = "0.18", features = ["png"] }
glib = { workspace = true }
