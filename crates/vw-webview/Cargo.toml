[package]
name = "vw-webview"
description = "The preview engine on Tauri: child webviews in the main window with their own storage and no IPC"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-preview = { path = "../vw-preview" }
# The agent browser's network guard.
vw-netguard = { path = "../vw-netguard" }
vw-platform = { path = "../vw-platform", features = ["webview"] }
# `unstable` = `Window::add_child` (multiwebview; on docs.rs for 2.12.2: still behind the
# flag). Same version as the app crate; the feature unifies into the app's tauri.
tauri = { version = "2.12.1", features = ["unstable"] }
tokio = { version = "1.53", features = ["sync", "time", "rt"] }
tracing = "0.1"
url = "2"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# The same versions tauri/wry use (lockfile): GTK placement of child webviews and WebKitGTK snapshots.
gtk = "0.18"
webkit2gtk = "=2.0.2"
cairo-rs = { version = "0.18", features = ["png"] }
glib = "0.18"
