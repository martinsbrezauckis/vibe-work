[package]
name = "vw-git"
description = "The outer git loop of the Changes tab: branch facts, the user's commit, push, pull requests (gh or the forge's page), the PR card, bringing a copy back into its base"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# TypeScript bindings of the public types, enabled by vw-core-api's `ts` feature (gen-core-ts).
ts = ["dep:ts-rs", "vw-worktrees/ts"]

[dependencies]
# The one hardened git runner (adds its Worktree and Publish profiles).
vw-changes = { path = "../vw-changes" }
# The repository-program preflight (one list of filter/fsmonitor rules for the whole app).
vw-worktrees = { path = "../vw-worktrees" }
# Plain path spellings (a verbatim `\\?\C:\...` root and git's `C:\...` answer compare equal).
vw-platform = { path = "../vw-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
# Query escaping of the forge pages (already in Cargo.lock through vw-platform and vw-core-api).
url = "2"
ts-rs = { version = "12.0.1", optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
