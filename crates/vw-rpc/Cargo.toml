[package]
name = "vw-rpc"
description = "JSON-RPC over stdio: framing, request matching, callbacks"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-protocol = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["float_roundtrip"] } # exact float parsing (durationMs etc.)
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "rt", "sync", "time"] }
tracing = { workspace = true }
