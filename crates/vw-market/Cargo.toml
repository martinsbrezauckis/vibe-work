[package]
name = "vw-market"
description = "The Tools marketplace: the curated catalog of skill packs, MCP servers and plugins, pinned downloads, safe unpacking, plugin assembly and the installed state"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# TypeScript bindings of the catalog types, enabled by vw-core-api's `ts` feature (gen-core-ts).
ts = ["dep:ts-rs"]

[dependencies]
vw-platform = { workspace = true }
# All already in the lock file: sha2 0.10.9 (vw-changes, vw-pages), flate2 1.1 and zip 9.1.3
# (vw-documents), tar 0.4.46 (through the Tauri bundler stack), base64 0.23 (vw-pages), reqwest 0.13.5 (vw-mistral).
sha2 = { workspace = true }
flate2 = { workspace = true }
tar = { workspace = true }
zip = { workspace = true, features = ["deflate"] }
base64 = "0.23"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true, features = ["fs", "process", "rt", "time", "io-util"] }
# The shared HTTPS client (OS trust store, no redirects followed) for the downloads.
vw-mistral = { workspace = true }
reqwest = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }
