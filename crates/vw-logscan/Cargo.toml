# Standalone session-log scanning; uses standard encoding and file libraries, called by Rust clients.
[package]
name = "vw-logscan"
description = "Find stored secret values in session logs and redact their reported locations"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
base64 = { workspace = true }
form_urlencoded = "1"
memchr = { workspace = true }
percent-encoding = "2"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
sha2 = "0.10"
tempfile = { workspace = true }
thiserror = { workspace = true }
walkdir = { workspace = true }
zeroize = "1"
