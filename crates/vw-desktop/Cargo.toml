# Linux accessibility pilot; depends on AT-SPI proxies, called only by Rust clients and tests.
[package]
name = "vw-desktop"
description = "Standalone Linux AT-SPI2 observe, act and verify pilot"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
atspi = { version = "=0.30.0", default-features = false, features = ["connection", "proxies", "zbus", "tokio"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1.53", features = ["macros", "rt", "time"] }
