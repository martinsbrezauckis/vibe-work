# Standalone GitHub read broker and PATH client; integration supplies the token and real gh.
[package]
name = "vw-gh-broker"
description = "User-local read-only GitHub CLI broker and credential-free client shim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
bstr = { version = "1", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", default-features = false, features = ["std"] }
http = "1"
interprocess = "=2.4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
url = "2"
zeroize = "1.8"

[target.'cfg(windows)'.dependencies]
windows-permissions = "=0.2.4"
widestring = "1"

[[bin]]
name = "vw-gh-broker"
path = "src/bin/broker.rs"

[[bin]]
name = "gh"
path = "src/bin/gh.rs"
