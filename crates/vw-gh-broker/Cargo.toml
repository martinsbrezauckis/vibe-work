# Standalone GitHub read broker and PATH client; integration supplies the token and real gh.
[package]
name = "vw-gh-broker"
description = "User-local read-only GitHub CLI broker and credential-free client shim"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-vocabulary = { workspace = true }
bstr = { version = "1", default-features = false, features = ["std"] }
clap = { version = "=4.6.7", default-features = false, features = ["std"] }
http = { workspace = true }
interprocess = "=2.4.5"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tempfile = { workspace = true }
url = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(windows)'.dependencies]
vw-platform = { workspace = true }
windows-permissions = "=0.2.4"
widestring = "1"

[[bin]]
name = "gh"
path = "src/bin/gh.rs"
