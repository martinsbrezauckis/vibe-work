[package]
name = "vw-supervisor"
description = "Spawns and supervises vibe-app-server"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
vw-platform = { workspace = true }
vw-agent-tools = { workspace = true }
# stored secret values register here so the Debug API never returns them.
vw-secrets = { workspace = true }
vw-rpc = { workspace = true }
vw-protocol = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] } # exact float parsing (durationMs etc.)
sha2 = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }
# Process groups (Unix) and kill-on-close job objects created suspended + assigned by handle
# (Windows), without unsafe code in our crates. 10.0.1, MIT OR Apache-2.0.
process-wrap = { workspace = true, features = ["tokio1", "kill-on-drop", "process-group", "job-object", "creation-flags"] }

[target.'cfg(unix)'.dependencies]
# The synchronous last-resort stop at quit (`Supervisor::kill_now`): SIGKILL by id when the async runtime cannot
# run the normal stop. Same version and features as vw-terminal's.
nix = { workspace = true, features = ["signal", "process"] }
