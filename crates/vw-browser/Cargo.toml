[package]
name = "vw-browser"
description = "The agent-controlled browser: observe, act with actionability checks, receipts, prompt guard, redaction, Stop and the action log"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[features]
# Optional agent capture directly into the vault. Off in default builds.
agent-vault = []
# TypeScript bindings for the UI (through vw-core-api's gen-core-ts).
ts = ["dep:ts-rs"]
# Private end-to-end builds may map one explicit loopback origin to a provider.
e2e-script = []

[dependencies]
gif = "=0.14.2"
vw-ask = { workspace = true }
vw-vocabulary = { workspace = true }
# A captured key is held in a zeroizing buffer until the core stores it.
zeroize = { workspace = true }
vw-preview = { workspace = true }
# Capture files are written with every registered stored secret withheld (a vault password a page copied
# into its text must not reach a file the agent then reads with Vibe's own tools).
vw-secrets = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
# Annotation crops travel as base64 (the version vw-preview uses).
base64 = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "macros", "rt"] }
# Capture: page URLs (the folder's host fallback) and bounded parallel media fetches.
url = { workspace = true }
futures-util = { workspace = true, features = ["std"] }
# Captured SVGs are re-serialised through an allowlist; 0.42.0 is already in the lock file.
quick-xml = "0.42"
# Capture files are written through directory handles of the checked folders: a folder swapped for a
# link after its checks cannot redirect a write outside it. 4.0.3 is already in the lock file (vw-pages, vw-core-api).
cap-std = { workspace = true }
ts-rs = { workspace = true, optional = true, features = ["serde-json-impl", "no-serde-warnings"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Older system WebKitGTK printers omit PDF annotations (upstream 302265). Keep a text-only fallback for those
# installations; native link-bearing output passes through unchanged.
pdf-extract = "=0.12.1"
lopdf = { workspace = true }
