<!doctype html>
<!-- Pointer input fixture shared by Chromium and native-engine tests. Handlers record trusted page events;
     the observer independently detects the app menu's closed-shadow host without reading its contents. -->
<meta charset="utf-8">
<title>Pointer events</title>
<style>
  body { margin: 0; }
  #target, #cell { position: fixed; left: 20px; top: 20px; width: 180px; height: 50px; }
  #cell { top: 100px; }
</style>
<button id="target">Menu button</button>
<div id="cell" ondblclick="record(event)" oncontextmenu="record(event)" onauxclick="record(event)">Cell A1</div>
<script>
  document.body.dataset.events = "[]";
  document.body.dataset.appMenus = "0";
  function record(event) {
    const events = JSON.parse(document.body.dataset.events);
    events.push({ type: event.type, target: event.currentTarget.id, trusted: event.isTrusted, button: event.button });
    document.body.dataset.events = JSON.stringify(events);
  }
  for (const type of ["contextmenu", "dblclick", "auxclick", "click"]) target.addEventListener(type, record);
  new MutationObserver(records => {
    for (const record of records) for (const node of record.addedNodes) {
      if (node.nodeType === 1 && node.localName === "div") {
        document.body.dataset.appMenus = String(Number(document.body.dataset.appMenus) + 1);
      }
    }
  }).observe(document.documentElement, { childList: true });
</script>
