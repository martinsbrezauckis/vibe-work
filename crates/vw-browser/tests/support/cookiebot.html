<!-- Sanitized Delfi Cookiebot structure, fetched once using its declared CMP.
     Used by cookie_banner.rs with production scripts; no external URLs, scripts or vendor code.
     Hidden cookie/vendor tables precede the footer in the real banner (48,658 elements).
     The test expands #cookie-details with inert local rows to exercise the traversal limit. -->
<!doctype html>
<title>Cookie choices</title>
<style>
  body { margin: 0 }
  #CybotCookiebotDialog { position: fixed; inset: 5px; z-index: 100; background: white; display: flex }
  .CybotCookiebotDialogContentWrapper { width: 100% }
  .CybotCookiebotDialogHide { display: none }
  #CybotCookiebotDialogBodyButtonsWrapper { display: flex; flex-wrap: wrap; gap: 4px }
  button { font: 14px sans-serif; padding: 8px }
</style>
<main><p>Local article</p></main>
<div id="CybotCookiebotDialog" role="region" aria-label="Cookie consent" tabindex="-1"
     class="CybotEdge CybotCookiebotDialogActive">
  <div class="CybotCookiebotDialogContentWrapper">
    <div id="CybotCookiebotDialogTabContent">
      <div id="CybotCookiebotDialogBody" class="CybotCookiebotDialogTabPanel" role="tabpanel">
        <div class="CybotCookiebotScrollContainer"><p>Sīkdatņu izvēle</p></div>
      </div>
      <div class="CybotCookiebotScrollContainer CybotCookiebotDialogHide">
        <div id="CybotCookiebotDialogTabContentDetails" role="tabpanel">
          <a href="#reject-1">Noraidīt visu</a>
          <a href="#reject-2">Noraidīt visu</a>
          <a href="#reject-3">Noraidīt visu</a>
          <div id="cookie-details"></div>
        </div>
      </div>
    </div>
    <div id="CybotCookiebotDialogFooter" class="CybotCookiebotScrollContainer">
      <div class="CybotCookiebotScrollArea">
        <div id="CybotCookiebotDialogBodyButtons">
          <div id="CybotCookiebotDialogBodyButtonsWrapper">
            <button id="CybotCookiebotDialogBodyButtonDecline" tabindex="0" lang="lv">Noraidīt</button>
            <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowallSelection"
                    class="CybotCookiebotDialogHide" tabindex="0" lang="lv">Ļaut atlasi</button>
            <button id="CybotCookiebotDialogBodyLevelButtonCustomize" tabindex="0" lang="lv">Pielāgot<div class="CybotCookiebotDialogArrow"></div></button>
            <button id="CybotCookiebotDialogBodyLevelButtonLevelOptinAllowAll" tabindex="0" lang="lv">Atļaut visu</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
