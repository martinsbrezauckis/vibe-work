# Production code must not panic; tests may unwrap/expect.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
# Product names that are not code identifiers ("ShellX" is the sibling app our code is extracted
# from and is cited in many doc comments; "OpenCode" is a coding agent whose setup can be imported).
# ".." keeps clippy's default list.
doc-valid-idents = ["ShellX", "OpenCode", ".."]
